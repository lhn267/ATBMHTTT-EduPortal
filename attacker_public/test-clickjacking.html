<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trang Kiểm Thử Clickjacking / Iframe (test.html)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f8fafc;
    }
    .header-bar {
      background: #1e293b;
      color: white;
      padding: 15px 24px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .iframe-wrapper {
      border: 3px dashed #ef4444;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      background: white;
    }
    iframe {
      width: 100%;
      height: 750px;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div>
      <h3 style="margin: 0;">Trang Web Bên Ngoài Đang Nhúng EduPortal (Kiểm Thử Clickjacking)</h3>
      <p style="margin: 5px 0 0; font-size: 13px; color: #94a3b8;">
        Mã nhúng: <code>&lt;iframe src="http://localhost:3000"&gt;&lt;/iframe&gt;</code> (Thiếu Header X-Frame-Options)
      </p>
    </div>
  </div>

  <div class="iframe-wrapper">
    <iframe id="eduFrame" src="http://localhost:3000"></iframe>
  </div>

  <script>
    function getEduPortalOrigin() {
      if (window.location.hostname.includes('onrender.com') || window.location.protocol === 'https:') {
        return 'https://eduportal-nhom06.onrender.com';
      }
      return `http://${window.location.hostname || 'localhost'}:3000`;
    }
    document.getElementById('eduFrame').src = getEduPortalOrigin();
  </script>

</body>
</html>
